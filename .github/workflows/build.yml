# Trains and evaluates on MovieLens 1M, saves the numbers to results/ and README.md,
# and publishes the page to GitHub Pages. Runs when the code changes, or by hand.
name: Build results and site

on:
  push:
    branches: [main]
    paths-ignore:
      - "results/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache MovieLens 1M
        uses: actions/cache@v6
        with:
          path: data
          key: movielens-1m

      - name: Train, evaluate and build the page
        run: python -m recsys run --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - name: Save results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs README.md
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "Update results and page"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
